name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one OS failing must not hide the others' results
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test ./...
      # Show which service manager each OS really used (launchd on macOS,
      # breakaway/WMI on Windows), not just that the suite passed.
      - name: Service manager and Windows console, verbose
        run: go test -count=1 -v -run "TestSessionRunsUnderTheRealServiceManager|TestWindowsSessionOnConPTY|TestDaemonStartsWithoutTheForkOverride|TestWMIStartsAProcess|TestChooseSupervisor" ./internal/server
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - run: go build ./cmd/hqsh
